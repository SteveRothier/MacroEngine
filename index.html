<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Caster</title>
    <!-- Force WebKit scrollbar path (WebView2) before React CSS loads -->
    <style>
      html {
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      }
      *::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      *::-webkit-scrollbar-track {
        background: #121212;
        border-radius: 0;
      }
      *::-webkit-scrollbar-thumb {
        background: #4f4f4f;
        border-radius: 0;
        border: none;
      }
      *::-webkit-scrollbar-button {
        display: none !important;
        width: 0 !important;
        height: 0 !important;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
