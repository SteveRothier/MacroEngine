[package]
name = "caster-engine"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Caster core engine contracts (state, cancel, actions)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ureq = { version = "2", default-features = false, features = ["tls"] }
boa_engine = "0.20"
boa_runtime = "0.20"
oxc_allocator = "0.48.0"
oxc_parser = "0.48.0"
oxc_codegen = "0.48.0"
oxc_span = "0.48.0"
oxc_transformer = "0.48.0"
oxc_semantic = "0.48.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
] }
