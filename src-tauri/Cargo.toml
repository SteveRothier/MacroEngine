[package]
name = "caster"
version = "0.1.0"
description = "Caster — visual Windows automation (macros + clicker)"
authors = ["SteveRothier"]
edition = "2021"
license = "MIT"

[lib]
name = "caster_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
caster-engine = { path = "crates/engine" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
