[package]
name = "macroengine"
version = "0.1.0"
description = "MacroEngine — visual Windows automation engine"
authors = ["SteveRothier"]
edition = "2021"
license = "MIT"

[lib]
name = "macroengine_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
